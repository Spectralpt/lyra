<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="/static/style.css">
    <title>{{.title}}</title>
    <style>
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 24px;
            border-radius: 8px;
            max-width: 800px;
            width: 90%;
            max-height: 90%;
            overflow-y: auto;
        }

        .modal-close {
            cursor: pointer;
            font-size: 24px;
            border: none;
            background: none;
            float: right;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>FIWARE Project Generator</h1>

    <div class="section">
        <div class="section-title">Project Type</div>
        <div class="card-grid card-grid-3">
            <div class="card selected">
                <div class="card-title">Full Project</div>
                <div class="card-description">Complete IoT + FIWARE solution</div>
            </div>
            <div class="card">
                <div class="card-title">Just IoT</div>
                <div class="card-description">IoT devices and sensors only</div>
            </div>
            <div class="card">
                <div class="card-title">Just FIWARE</div>
                <div class="card-description">FIWARE platform components only</div>
            </div>
        </div>
    </div>

    <!-- Inside your existing .section for Modules -->
    <div class="section">
        <div class="section-title">Modules (Select all that apply)</div>
        <div class="card-grid card-grid-3">
            {{ range .modules }}
            <div class="card">
                <div class="card-title">{{ .Name }}</div>
                <div class="card-description">{{ .Description }}</div>
            </div>
            {{ end }}
        </div>

        <!-- Selected Modules Summary -->
        <div class="selected-summary">
            <div class="selected-summary-title">Selected Modules:</div>
            <div class="selected-tags">
                <!-- JS will fill this dynamically -->
            </div>
        </div>
    </div>

    <div class="section">
        <div class="section-title">Project Details</div>
        <div class="form-group">
            <label class="label">Project Name</label>
            <input class="input" type="text" id="project-name" placeholder="Enter project name">
        </div>

        <div class="form-group">
            <label class="label">Description</label>
            <textarea class="textarea" id="project-description" placeholder="Describe your project"></textarea>
        </div>

        <div class="grid grid-2">
            <div class="form-group">
                <label class="label">Programming Language</label>
                <select class="select" id="language">
                    {{ range .languages }}
                    <option>{{ . }}</option>
                    {{ end }}
                </select>
            </div>
        </div>

        <div class="form-group" style="display: flex; flex-direction: column; align-items: flex-start;">
            <label for="git" style="margin-bottom: 4px;">Initialize with Git</label>
            <input style="width: auto" class="input" type="checkbox" id="git">
        </div>

        <div class="form-group">
            <label for="license">License</label>
            <select class="select" id="license">
                {{ range .licences }}
                <option>{{ . }}</option>
                {{ end }}
            </select>
        </div>
    </div>

    <div class="section">
        <div class="text-center">
            <button class="btn btn-primary">Generate Project</button>
            <button class="btn btn-secondary" style="margin-left: 12px;">Save Configuration</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Handle module cards (targeting the second section with card-grid-3)
        const moduleSection = document.querySelectorAll('.section')[1]; // Second section contains modules
        const moduleCards = moduleSection ? moduleSection.querySelectorAll('.card-grid-3 .card') : [];
        moduleCards.forEach(card => {
            card.addEventListener('click', function () {
                this.classList.toggle('selected');
                updateSelectedSummary();
            });
        });

        // Handle project type cards specifically (first section)
        const projectTypeSection = document.querySelectorAll('.section')[0]; // First section contains project types
        const projectTypeCards = projectTypeSection ? projectTypeSection.querySelectorAll('.card-grid-3 .card') : [];
        projectTypeCards.forEach(card => {
            card.addEventListener('click', function () {
                this.parentElement.querySelectorAll('.card').forEach(c => {
                    c.classList.remove('selected', 'selected-green', 'selected-purple');
                });
                const title = this.querySelector('.card-title').textContent;
                if (title === 'Just IoT') {
                    this.classList.add('selected-green');
                } else if (title === 'Just FIWARE') {
                    this.classList.add('selected-purple');
                } else {
                    this.classList.add('selected');
                }
            });
        });

        function updateSelectedSummary() {
            const selectedCards = document.querySelectorAll('.card.selected');
            const tagsContainer = document.querySelector('.selected-tags');
            if (tagsContainer) {
                tagsContainer.innerHTML = '';
                selectedCards.forEach(card => {
                    const title = card.querySelector('.card-title').textContent;
                    const tag = document.createElement('span');
                    tag.className = 'selected-tag';
                    tag.textContent = title;
                    tagsContainer.appendChild(tag);
                });
            }
        }

        updateSelectedSummary();

        const moreCard = document.querySelector('.card.more');
        const modal = document.querySelector('.modal-backdrop');
        const closeModal = document.querySelector('.modal-close');

        if (moreCard) {
            moreCard.addEventListener('click', () => {
                modal.style.display = 'flex';
            });
        }

        if (closeModal) {
            closeModal.addEventListener('click', () => {
                modal.style.display = 'none';
            });
        }

        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        document.querySelector('.btn-primary').addEventListener('click', function () {
            const name = document.getElementById('project-name').value;
            const description = document.getElementById('project-description').value;
            const language = document.getElementById('language').value;
            const git = document.getElementById('git').checked;
            const license = document.getElementById('license').value;

            const selectedModules = Array.from(document.querySelectorAll('.card.selected .card-title'))
                .map(el => el.textContent);

            const data = {
                name,
                language,
                modules: selectedModules,
                git,
                license
            };

            fetch('/project', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).catch(err => {
                console.error('Error:', err);
                alert('Error sending project data.');
            });
        });
    });
</script>
</body>
</html>
